name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: ScreenCompare-windows-x86_64.exe
            bin_path: target/release/screen_compare.exe
          - os: ubuntu-latest
            target_name: ScreenCompare-linux-x86_64
            bin_path: target/release/screen_compare

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "${{ matrix.bin_path }}" "dist/${{ matrix.target_name }}"
          $hash = (Get-FileHash "dist/${{ matrix.target_name }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.target_name }}" | Out-File -Encoding ascii "dist/${{ matrix.target_name }}.sha256"

      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist
          cp "${{ matrix.bin_path }}" "dist/${{ matrix.target_name }}"
          chmod +x "dist/${{ matrix.target_name }}"
          (cd dist && sha256sum "${{ matrix.target_name }}" > "${{ matrix.target_name }}.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target_name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
