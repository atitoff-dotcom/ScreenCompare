[package]
name = "screen_compare"
version = "0.1.1"
edition = "2021"

[dependencies]
eframe = { version = "0.27.2", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.27.2"
rfd = "0.14.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "1.1.1", default-features = false, features = ["deflate"] }
png = "0.17"
ureq = { version = "2.12", features = ["json"] }
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
